<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>slidesync</h1>

    <div id="inactive-view">
      <div class="status disconnected">
        <span class="dot"></span>
        <span id="no-active-session"></span>
      </div>
      <p class="hint" id="open-presentation-hint"></p>
    </div>

    <div id="active-view" class="hidden">
      <div class="status connected">
        <span class="dot"></span>
        <span id="active-session"></span>
      </div>
      <div class="room-code">
        <div class="label" id="room-code-label"></div>
        <div class="code" id="roomCode">------</div>
      </div>
      <div class="info-row">
        <span class="label" id="current-slide-label"></span>
        <span id="currentSlide" class="value">-</span>
      </div>
    </div>

    <div class="settings">
      <div class="setting-row">
        <div class="setting-label" id="qr-code-label"></div>
        <div class="segmented" role="radiogroup" id="qr-color-group">
          <button type="button" class="seg" role="radio" data-value="off" id="qr-color-off"></button>
          <button type="button" class="seg" role="radio" data-value="black" id="qr-color-black"></button>
          <button type="button" class="seg" role="radio" data-value="white" id="qr-color-white"></button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label" id="qr-position-label"></div>
        <div class="segmented positions" role="radiogroup" id="qr-position-group">
          <button type="button" class="seg pos-btn" role="radio" data-value="top-left" id="qr-pos-tl">
            <span class="pos-icon"><span class="dot-tl"></span></span>
          </button>
          <button type="button" class="seg pos-btn" role="radio" data-value="top-right" id="qr-pos-tr">
            <span class="pos-icon"><span class="dot-tr"></span></span>
          </button>
          <button type="button" class="seg pos-btn" role="radio" data-value="bottom-left" id="qr-pos-bl">
            <span class="pos-icon"><span class="dot-bl"></span></span>
          </button>
          <button type="button" class="seg pos-btn" role="radio" data-value="bottom-right" id="qr-pos-br">
            <span class="pos-icon"><span class="dot-br"></span></span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
